name: Ovenbird availability check

on:
  workflow_dispatch: {}
  # Triggered externally (cron-job.org) every ~10 min via the API, since
  # GitHub's native `schedule:` trigger proved unreliable (observed gaps of
  # 3-10+ hours instead of 10 minutes). Keep this workflow_dispatch-only to
  # avoid duplicate/overlapping runs if a native schedule were added back.

permissions:
  contents: write

concurrency:
  group: ovenbird-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python tracker.py --once

      - name: Persist state
        run: |
          git config user.name "ovenbird-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update tracker state [skip ci]"
          git push
